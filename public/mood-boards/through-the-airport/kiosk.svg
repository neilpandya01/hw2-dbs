    <text x="198" y="228" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', sans-serif" font-size="13" font-weight="400" fill="#5f646b" text-anchor="start">Step 1 of 4</text>
