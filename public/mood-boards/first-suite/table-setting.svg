    <rect x="133.4" y="238" width="3.2" height="30" rx="1.6"/><rect x="139.4" y="238" width="3.2" height="30" rx="1.6"/><rect x="145.4" y="238" width="3.2" height="30" rx="1.6"/><rect x="151.4" y="238" width="3.2" height="30" rx="1.6"/>
    <path d="M132 264 H156 V272 C156 284 147 290 147 312 H141 C141 290 132 284 132 272 Z"/>
    <path d="M141 312 C138 348 137 394 138 406 Q144 416 150 406 C151 394 150 348 147 312 Z"/>
  </g>
  <g fill="#d4b98a" stroke="#a8844f" stroke-width=".75">
    <path d="M418 310 V228 C418 221 421 218 424 220 C428 238 427 288 425 310 Z"/>
    <path d="M417 310 H426 C427 348 428 404 426 412 Q421.5 420 417 412 C415 404 416 348 417 310 Z"/>
