<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" width="560" height="560">
<defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .23  0 0 0 0 .16  0 0 0 0 .12  0 0 0 0.035 0"/></filter>
  <radialGradient id="daylight" cx=".3" cy="0" r="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<rect width="560" height="560" fill="#f4eee4"/>
<defs>
    <linearGradient id="cloth_table" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf8f2"/><stop offset="1" stop-color="#f4eee4"/></linearGradient>
    <filter id="linen_table" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".8 .8" numOctaves="3" seed="4" result="n"/><feColorMatrix in="n" result="c" values="0 0 0 0 0.5  0 0 0 0 0.43  0 0 0 0 0.34  0 0 0 0.12 0"/><feComposite in="c" in2="SourceGraphic" operator="in"/></filter>
    <radialGradient id="plate_table" cx=".42" cy=".4" r=".65"><stop offset="0" stop-color="#fffdf9"/><stop offset="1" stop-color="#fbf8f2"/></radialGradient>
    <linearGradient id="napkin_table" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e3c6bf"/><stop offset="1" stop-color="#c39a92"/></linearGradient>
    <radialGradient id="bloom_table" cx=".45" cy=".45" r=".6"><stop offset="0" stop-color="#6e2a34"/><stop offset="1" stop-color="#c39a92"/></radialGradient>
    <filter id="napLinen_table" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9 .5" numOctaves="3" seed="6" result="n"/><feColorMatrix in="n" result="c" values="0 0 0 0 0.5  0 0 0 0 0.43  0 0 0 0 0.34  0 0 0 0.14 0"/><feComposite in="c" in2="SourceGraphic" operator="in"/></filter>
  </defs>
  <rect width="560" height="560" fill="url(#cloth_table)"/>
  <rect width="560" height="560" filter="url(#linen_table)"/>
  <!-- pressed fold in the tablecloth -->
  <line x1="0" y1="54" x2="560" y2="54" stroke="#e6dccb" stroke-width="1.2" stroke-opacity="1"/>
  <line x1="0" y1="55.5" x2="560" y2="55.5" stroke="#fff" stroke-width="1" stroke-opacity="0.9"/>

  <!-- charger with a fine brass rim, dinner plate on it -->
  <ellipse cx="282" cy="322" rx="124" ry="124" fill="#3b2a20" opacity="0.05" filter="url(#soft)"/>
  <circle cx="280" cy="318" r="124" fill="#e6dccb" stroke="#7d5f33" stroke-width="1.5"/>
  <circle cx="280" cy="318" r="119" fill="none" stroke="#a8844f" stroke-width=".75"/>
  <circle cx="280" cy="318" r="100" fill="url(#plate_table)" stroke="#a49180" stroke-width=".75"/>
  <circle cx="280" cy="318" r="96" fill="none" stroke="#a8844f" stroke-width=".6"/>
  <circle cx="280" cy="318" r="66" fill="none" stroke="#e6dccb" stroke-width="1"/>
  <!-- folded napkin on the plate, with a monogram -->
  <g transform="rotate(0 280 318)">
    <rect x="242" y="256" width="76" height="124" fill="url(#napkin_table)" stroke="#c39a92" stroke-width=".75"/>
    <rect x="242" y="256" width="76" height="124" filter="url(#napLinen_table)"/>
    <path d="M242 256 L288 256 L242 308 Z" fill="#e3c6bf" opacity=".9"/>
    <line x1="288" y1="256" x2="242" y2="308" stroke="#c39a92" stroke-width="0.9" stroke-opacity="1"/>
    <line x1="310" y1="256" x2="310" y2="380" stroke="#c39a92" stroke-width="1" stroke-opacity="1"/>
    <rect x="248" y="262" width="64" height="112" fill="none" stroke="#fbf8f2" stroke-width=".6" stroke-dasharray="1.5 2" opacity=".9"/>
    <text x="276" y="356" text-anchor="middle" font-family="'Cormorant Garamond', 'Cormorant', Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#6e2a34">S</text>
  </g>

