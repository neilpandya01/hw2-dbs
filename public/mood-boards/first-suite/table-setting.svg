  <g fill="#d4b98a" stroke="#a8844f" stroke-width=".75">
    <rect x="109.4" y="222" width="3.2" height="30" rx="1.6"/><rect x="115.4" y="222" width="3.2" height="30" rx="1.6"/><rect x="121.4" y="222" width="3.2" height="30" rx="1.6"/><rect x="127.4" y="222" width="3.2" height="30" rx="1.6"/>
    <path d="M108 248 H132 V256 C132 268 123 274 123 296 H117 C117 274 108 268 108 256 Z"/>
    <path d="M117 296 C114 332 113 392 114 404 Q120 414 126 404 C127 392 126 332 123 296 Z"/>
