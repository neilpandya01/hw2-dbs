      <linearGradient id="ring_vanity" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d4b98a"/><stop offset="1" stop-color="#a8844f"/></linearGradient>
      <linearGradient id="fascia_vanity" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7d5a43"/><stop offset="1" stop-color="#6b4a36"/></linearGradient>
