    <circle cx="308" cy="284" r="3" fill="none" stroke="#3b2a20" stroke-width=".9"/>
    <line x1="313" y1="284" x2="315" y2="284" stroke="#3b2a20" stroke-width="0.8" stroke-opacity="1"/><line x1="311.5" y1="287.5" x2="312.9" y2="288.9" stroke="#3b2a20" stroke-width="0.8" stroke-opacity="1"/><line x1="308" y1="289" x2="308" y2="291" stroke="#3b2a20" stroke-width="0.8" stroke-opacity="1"/><line x1="304.5" y1="287.5" x2="303.1" y2="288.9" stroke="#3b2a20" stroke-width="0.8" stroke-opacity="1"/><line x1="303" y1="284" x2="301" y2="284" stroke="#3b2a20" stroke-width="0.8" stroke-opacity="1"/><line x1="304.5" y1="280.5" x2="303.1" y2="279.1" stroke="#3b2a20" stroke-width="0.8" stroke-opacity="1"/><line x1="308" y1="279" x2="308" y2="277" stroke="#3b2a20" stroke-width="0.8" stroke-opacity="1"/><line x1="311.5" y1="280.5" x2="312.9" y2="279.1" stroke="#3b2a20" stroke-width="0.8" stroke-opacity="1"/>
