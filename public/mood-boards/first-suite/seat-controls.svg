<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420">
<defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .23  0 0 0 0 .16  0 0 0 0 .12  0 0 0 0.035 0"/></filter>
  <radialGradient id="daylight" cx=".3" cy="0" r="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<rect width="600" height="420" fill="#f4eee4"/>
<defs>
      <linearGradient id="body_ctrl" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#fbf8f2"/><stop offset="1" stop-color="#e6dccb"/></linearGradient>
      <linearGradient id="dock_ctrl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d4b98a"/><stop offset=".5" stop-color="#a8844f"/><stop offset="1" stop-color="#7d5f33"/></linearGradient>
      <linearGradient id="desk_ctrl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcc7a4"/><stop offset="1" stop-color="#c8ae86"/></linearGradient>
      <filter id="brush_ctrl" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".02 .9" numOctaves="2" seed="3" result="n"/><feColorMatrix in="n" result="c" values="0 0 0 0 0.4  0 0 0 0 0.3  0 0 0 0 0.18  0 0 0 0.3 0"/><feComposite in="c" in2="SourceGraphic" operator="in"/></filter>
      <filter id="leather_ctrl" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".55" numOctaves="3" seed="2" result="n"/><feColorMatrix in="n" result="c" values="0 0 0 0 0.45  0 0 0 0 0.36  0 0 0 0 0.26  0 0 0 0.15 0"/><feComposite in="c" in2="SourceGraphic" operator="in"/></filter>
    </defs>
    <!-- console surface -->
    <rect y="338" width="600" height="82" fill="url(#desk_ctrl)"/>
    <rect y="338" width="600" height="82" filter="url(#leather_ctrl)" fill="#000"/>
    <line x1="0" y1="338" x2="600" y2="338" stroke="#a8844f" stroke-width="1" stroke-opacity="1"/>
    <line x1="0" y1="350" x2="600" y2="350" stroke="#857462" stroke-width="0.6" stroke-opacity="0.6"/>
