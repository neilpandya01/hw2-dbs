    <line x1="324" y1="284" x2="398" y2="284" stroke="#3e4c5e" stroke-width="1.6" stroke-opacity="1"/>
    <circle cx="398" cy="284" r="5" fill="#fff" stroke="#3e4c5e" stroke-width="1"/>
<rect width="600" height="420" fill="url(#daylight)"/>
<rect width="600" height="420" filter="url(#grain)"/>
