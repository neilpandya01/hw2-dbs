      <path d="M0 318 C150 300, 250 268, 350 222 S520 136, 600 112" fill="none" stroke="#fff" stroke-width="18" opacity=".95" filter="url(#b3_linen)" transform="translate(-8 -14)"/>
      <path d="M0 318 C150 300, 250 268, 350 222 S520 136, 600 112" fill="none" stroke="#a49180" stroke-width="7" opacity=".5" filter="url(#b3_linen)" transform="translate(-1 -1)"/>
    </g>
    <path d="M0 318 C150 300, 250 268, 350 222 S520 136, 600 112" fill="none" stroke="#857462" stroke-width=".8"/>
    <!-- embroidered bordeaux border band on the turned-back hem -->
    <path d="M0 318 C150 300, 250 268, 350 222 S520 136, 600 112" fill="none" stroke="#6e2a34" stroke-width="5" transform="translate(-15 -32)"/>
    <path d="M0 318 C150 300, 250 268, 350 222 S520 136, 600 112" fill="none" stroke="#a65a69" stroke-width=".6" stroke-dasharray="1.6 1.6" transform="translate(-15 -32)"/>
    <path d="M0 318 C150 300, 250 268, 350 222 S520 136, 600 112" fill="none" stroke="#6e2a34" stroke-width=".7" transform="translate(-14 -25)"/>
    <path d="M0 318 C150 300, 250 268, 350 222 S520 136, 600 112" fill="none" stroke="#6e2a34" stroke-width=".7" transform="translate(-16 -39)"/>
    <rect width="600" height="420" filter="url(#warp_linen)" fill="#000"/>
    <rect width="600" height="420" filter="url(#weft_linen)" fill="#000"/>
<rect width="600" height="420" fill="url(#daylight)"/>
<rect width="600" height="420" filter="url(#grain)"/>
</svg>
