    <path d="M459 238.5 v7" stroke="#cfa587" stroke-width=".6" opacity=".7"/>
    <line x1="446" y1="233" x2="472" y2="235" stroke="#cfa587" stroke-width="12" stroke-linecap="round"/>
    <line x1="446" y1="233" x2="472" y2="235" stroke="#e6c6aa" stroke-width="10.5" stroke-linecap="round"/>
    <path d="M455 229.25 v7.5" stroke="#cfa587" stroke-width=".6" opacity=".7"/>
    <line x1="443" y1="224" x2="470" y2="226" stroke="#cfa587" stroke-width="12.5" stroke-linecap="round"/>
    <line x1="443" y1="224" x2="470" y2="226" stroke="#e6c6aa" stroke-width="11" stroke-linecap="round"/>
    <path d="M452 220 v8" stroke="#cfa587" stroke-width=".6" opacity=".7"/>
  <path d="M500 196 C484 198 462 204 444 210" fill="none" stroke="#cfa587" stroke-width="12.5" stroke-linecap="round"/>
  <path d="M500 196 C484 198 462 204 444 210" fill="none" stroke="#e6c6aa" stroke-width="11" stroke-linecap="round"/>
  <path d="M441 207 q4 -2 8 -2" fill="none" stroke="#fbf8f2" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="470" y1="197" x2="488" y2="193" stroke="#cfa587" stroke-width="0.6" stroke-opacity="0.6"/>
<rect width="600" height="440" fill="url(#daylight)"/>
<rect width="600" height="440" filter="url(#grain)"/>
</svg>
