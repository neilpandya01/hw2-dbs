<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="600" height="440">
<defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .23  0 0 0 0 .16  0 0 0 0 .12  0 0 0 0.035 0"/></filter>
  <radialGradient id="daylight" cx=".3" cy="0" r="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<rect width="600" height="440" fill="#f4eee4"/>
<defs>
    <linearGradient id="wall_towel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fbf8f2"/><stop offset="1" stop-color="#f4eee4"/></linearGradient>
    <linearGradient id="surface_towel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6dccb"/><stop offset="1" stop-color="#dcc7a4"/></linearGradient>
    <linearGradient id="tray_towel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b4a36"/><stop offset="1" stop-color="#8a6448"/></linearGradient>
    <filter id="veneer_towel" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9 .03" numOctaves="3" seed="4" result="n"/><feColorMatrix in="n" result="c" values="0 0 0 0 0.25  0 0 0 0 0.14  0 0 0 0 0.08  0 0 0 0.35 0"/><feComposite in="c" in2="SourceGraphic" operator="in"/></filter>
    <linearGradient id="roll_towel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#fbf8f2"/><stop offset="1" stop-color="#e6dccb"/></linearGradient>
    <filter id="terry_towel" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="2" seed="6" result="n"/><feColorMatrix in="n" result="c" values="0 0 0 0 0.5  0 0 0 0 0.43  0 0 0 0 0.34  0 0 0 0.16 0"/><feComposite in="c" in2="SourceGraphic" operator="in"/></filter>
    <linearGradient id="tong_towel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d4b98a"/><stop offset="1" stop-color="#a8844f"/></linearGradient>
    <linearGradient id="sleeve_towel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8494a8"/><stop offset=".35" stop-color="#3e4c5e"/><stop offset="1" stop-color="#2c3644"/></linearGradient>
    <linearGradient id="skin_towel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6c6aa"/><stop offset="1" stop-color="#cfa587"/></linearGradient>
  </defs>
  <rect width="600" height="440" fill="url(#wall_towel)"/>
  <line x1="100" y1="0" x2="100" y2="326" stroke="#c8ae86" stroke-width="0.75" stroke-opacity="0.6"/>
  <!-- side console the tray rests on -->
  <rect y="326" width="600" height="114" fill="url(#surface_towel)"/>
