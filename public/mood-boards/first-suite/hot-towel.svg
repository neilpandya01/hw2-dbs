  <path d="M523 172 L541 242" stroke="#6e2a34" stroke-width="3"/>
  <line x1="528" y1="170" x2="546" y2="241" stroke="#8494a8" stroke-width="0.6" stroke-opacity="0.7"/>
  <path d="M504 180 L516 176 L533 244 L520 246 Z" fill="#fbf8f2" stroke="#a49180" stroke-width=".75"/>
  <path d="M512 186 C494 186 470 194 454 202 C442 208 440 228 450 238 C470 244 494 240 516 236 Z" fill="url(#skin_towel)" stroke="#cfa587" stroke-width=".75"/>
  
    <line x1="456" y1="250" x2="474" y2="251" stroke="#cfa587" stroke-width="10.5" stroke-linecap="round"/>
    <line x1="456" y1="250" x2="474" y2="251" stroke="#e6c6aa" stroke-width="9" stroke-linecap="round"/>
    <path d="M465 247 v6" stroke="#cfa587" stroke-width=".6" opacity=".7"/>
    <line x1="450" y1="242" x2="474" y2="244" stroke="#cfa587" stroke-width="11.5" stroke-linecap="round"/>
