  <ellipse cx="392" cy="326" rx="13" ry="4.4" fill="#f6eec2"/>
  <line x1="380" y1="326" x2="404" y2="326" stroke="#e6d67f" stroke-width="0.6" stroke-opacity="1"/><line x1="383.5" y1="323.2" x2="400.5" y2="328.8" stroke="#e6d67f" stroke-width="0.6" stroke-opacity="1"/><line x1="392" y1="322" x2="392" y2="330" stroke="#e6d67f" stroke-width="0.6" stroke-opacity="1"/><line x1="400.5" y1="323.2" x2="383.5" y2="328.8" stroke="#e6d67f" stroke-width="0.6" stroke-opacity="1"/>
  <path d="M368 330 C376 320 384 318 392 318" fill="none" stroke="#55644a" stroke-width=".9"/>
  <ellipse cx="372" cy="321" rx="2.6" ry="5" fill="#7c8a6a" transform="rotate(-40 372 324)"/><ellipse cx="380" cy="317" rx="2.6" ry="5" fill="#7c8a6a" transform="rotate(-20 380 320)"/><ellipse cx="388" cy="315.5" rx="2.6" ry="5" fill="#7c8a6a" transform="rotate(0 388 318.5)"/>

  <!-- far arm of the tongs, its tip tucked behind the towel -->
  <path d="M282 278 L470 222 Q488 220 494 216" fill="none" stroke="#7d5f33" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M282 278 L470 222 Q488 220 494 216" fill="none" stroke="#a8844f" stroke-width="4" stroke-linecap="round"/>
  <!-- the rolled towel, spiral end towards the viewer's left -->
  <ellipse cx="274" cy="305" rx="78" ry="3" fill="#3b2a20" opacity="0.14" filter="url(#soft)"/>
  <path d="M196 267 H352 A7 19 0 0 1 352 305 H196 Z" fill="url(#roll_towel)" stroke="#a49180" stroke-width=".75"/>
  <path d="M196 267 H352 A7 19 0 0 1 352 305 H196 Z" filter="url(#terry_towel)"/>
  <line x1="208" y1="267.5" x2="348" y2="267.5" stroke="#fff" stroke-width="1.2" stroke-opacity="1"/>
  <line x1="245.9" y1="268" x2="245.9" y2="304" stroke="#e6dccb" stroke-width="0.75" stroke-opacity="0.8"/><line x1="302.1" y1="268" x2="302.1" y2="304" stroke="#e6dccb" stroke-width="0.75" stroke-opacity="0.8"/>
  <ellipse cx="196" cy="286" rx="8" ry="19" fill="#fbf8f2" stroke="#a49180" stroke-width=".75"/>
  <path d="M196 286 m0 -2 a2 3 0 1 1 0 5 a3.5 7 0 1 1 1 -11 a5 12 0 1 1 -2 22 a6.5 16 0 1 1 3 -31" fill="none" stroke="#a49180" stroke-width=".75"/>

  <!-- steam -->
  <path d="M232 259 C222 242 242 224 230 198 C222 184 236 174 232 162" fill="none" stroke="#a49180" stroke-width="1.1" stroke-linecap="round" opacity="0.4"/><path d="M268 259 C258 238 278 221 266 192 C258 184 272 174 268 168" fill="none" stroke="#a49180" stroke-width="1.1" stroke-linecap="round" opacity="0.34"/><path d="M306 259 C296 234 316 218 304 186 C296 184 310 174 306 174" fill="none" stroke="#a49180" stroke-width="1.1" stroke-linecap="round" opacity="0.28"/>

  <!-- brass tongs: hinge in the hand, tips pinching the towel -->
  <path d="M276 266 L470 214 Q486 208 494 216" fill="none" stroke="#7d5f33" stroke-width="6" stroke-linecap="round"/>
  <path d="M276 266 L470 214 Q486 208 494 216" fill="none" stroke="url(#tong_towel)" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M276 266 L470 214" fill="none" stroke="#fff" stroke-width=".8" opacity=".6"/>
  <path d="M268 264 q-5 2 -4 6 L272 269" fill="url(#tong_towel)" stroke="#7d5f33" stroke-width=".75"/>

  <!-- the crew member's hand: slate sleeve with a bordeaux cuff stripe, a loose fist round the tongs -->
