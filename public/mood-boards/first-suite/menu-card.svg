<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 600" width="460" height="600">
<defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .23  0 0 0 0 .16  0 0 0 0 .12  0 0 0 0.035 0"/></filter>
  <radialGradient id="daylight" cx=".3" cy="0" r="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<rect width="460" height="600" fill="#f4eee4"/>
<defs>
    <linearGradient id="cloth_menu" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf8f2"/><stop offset="1" stop-color="#f4eee4"/></linearGradient>
    <filter id="linen_menu" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".8 .8" numOctaves="3" seed="9" result="n"/><feColorMatrix in="n" result="c" values="0 0 0 0 0.5  0 0 0 0 0.43  0 0 0 0 0.34  0 0 0 0.12 0"/><feComposite in="c" in2="SourceGraphic" operator="in"/></filter>
    <linearGradient id="card_menu" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf8f2"/><stop offset="1" stop-color="#f4eee4"/></linearGradient>
    <linearGradient id="folder_menu" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c98a5e"/><stop offset="1" stop-color="#9c5b34"/></linearGradient>
    <filter id="leather_menu" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".6" numOctaves="3" seed="7" result="n"/><feColorMatrix in="n" result="c" values="0 0 0 0 0.3  0 0 0 0 0.15  0 0 0 0 0.06  0 0 0 0.22 0"/><feComposite in="c" in2="SourceGraphic" operator="in"/></filter>
    <filter id="paper_menu" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".6" numOctaves="2" seed="3" result="n"/><feColorMatrix in="n" result="c" values="0 0 0 0 0.5  0 0 0 0 0.42  0 0 0 0 0.3  0 0 0 0.06 0"/><feComposite in="c" in2="SourceGraphic" operator="in"/></filter>
  </defs>
  <rect width="460" height="600" fill="url(#cloth_menu)"/>
  <rect width="460" height="600" filter="url(#linen_menu)"/>
  <line x1="0" y1="520" x2="460" y2="520" stroke="#e6dccb" stroke-width="1.2" stroke-opacity="1"/><line x1="0" y1="521.5" x2="460" y2="521.5" stroke="#fff" stroke-width="1" stroke-opacity="1"/>
  <!-- cognac leather menu folder, open beneath the card, with a bordeaux ribbon -->
  <g transform="rotate(2 230 300)">
    <ellipse cx="233" cy="304" rx="160" ry="234" fill="#3b2a20" opacity="0.06" filter="url(#soft)"/>
    <rect x="74" y="70" width="312" height="462" rx="6" fill="url(#folder_menu)"/>
    <rect x="74" y="70" width="312" height="462" rx="6" filter="url(#leather_menu)"/>
    <rect x="82" y="78" width="296" height="446" rx="3" fill="none" stroke="#c98a5e" stroke-width=".75" stroke-dasharray="3 2.5"/>
    <path d="M282 520 V560 L288 553 L294 560 V520 Z" fill="#6e2a34"/>
    <line x1="288" y1="520" x2="288" y2="556" stroke="#a65a69" stroke-width="0.6" stroke-opacity="0.7"/>
  </g>
  <g transform="rotate(-3 230 300)">
    <ellipse cx="233" cy="302" rx="140" ry="210" fill="#3b2a20" opacity="0.08" filter="url(#soft)"/>
    <rect x="94" y="96" width="272" height="412" fill="url(#card_menu)" stroke="#c8ae86" stroke-width=".75"/>
    <rect x="94" y="96" width="272" height="412" filter="url(#paper_menu)"/>
    <rect x="106" y="108" width="248" height="388" fill="none" stroke="#7d5f33" stroke-width=".75"/>
    <rect x="110" y="112" width="240" height="380" fill="none" stroke="#a8844f" stroke-width=".4" opacity=".6"/>
    <text x="230" y="146" text-anchor="middle" font-family="Jost, Futura, 'Century Gothic', 'Avenir Next', Helvetica, Arial, sans-serif" font-size="8" letter-spacing="4" fill="#7d5f33">SUITE 1A · DXB → JFK</text>
    <text x="230" y="206" text-anchor="middle" font-family="'Cormorant Garamond', 'Cormorant', Georgia, 'Times New Roman', serif" font-style="italic" font-size="44" fill="#6e2a34">Dinner</text>
    <line x1="190" y1="226" x2="270" y2="226" stroke="#6e2a34" stroke-width="0.75" stroke-opacity="1"/>
    <path d="M230 222 L234 226 L230 230 L226 226 Z" fill="#6e2a34"/>
    <text x="230" y="280" text-anchor="middle" font-family="'Cormorant Garamond', 'Cormorant', Georgia, 'Times New Roman', serif" font-size="18" letter-spacing="1" fill="#3b2a20">To Begin</text>
      <text x="230" y="302" text-anchor="middle" font-family="'Cormorant Garamond', 'Cormorant', Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#857462">Arabic mezze, warm khubz</text><text x="230" y="350" text-anchor="middle" font-family="'Cormorant Garamond', 'Cormorant', Georgia, 'Times New Roman', serif" font-size="18" letter-spacing="1" fill="#3b2a20">Main</text>
      <text x="230" y="372" text-anchor="middle" font-family="'Cormorant Garamond', 'Cormorant', Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#857462">Lamb loin, saffron rice</text><text x="230" y="420" text-anchor="middle" font-family="'Cormorant Garamond', 'Cormorant', Georgia, 'Times New Roman', serif" font-size="18" letter-spacing="1" fill="#3b2a20">To Finish</text>
      <text x="230" y="442" text-anchor="middle" font-family="'Cormorant Garamond', 'Cormorant', Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#857462">Date pudding, cardamom cream</text>
    <line x1="216" y1="458" x2="244" y2="458" stroke="#a8844f" stroke-width="0.75" stroke-opacity="1"/>
    <text x="230" y="478" text-anchor="middle" font-family="Jost, Futura, 'Century Gothic', 'Avenir Next', Helvetica, Arial, sans-serif" font-size="6.5" letter-spacing="3" fill="#857462">SERVED AT YOUR LEISURE</text>
  </g>

<rect width="460" height="600" fill="url(#daylight)"/>
<rect width="460" height="600" filter="url(#grain)"/>
</svg>
